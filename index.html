<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGUS // AI PHISHING DEFENSE PLATFORM</title>
    <style>
        /* Absolute Block for Stlite Loader */
        #stlite-main-loading, .stlite-kernel-status, #loading-screen { display: none !important; }

        body, html { margin: 0; padding: 0; background: #000000; color: #f8fafc; font-family: 'Inter', sans-serif; height: 100%; overflow: hidden; }
        
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999999;
            transition: opacity 1.2s ease, transform 1s cubic-bezier(0.77, 0, 0.175, 1);
        }

        .info-card {
            max-width: 480px; background: rgba(0, 212, 255, 0.02);
            border: 1px solid rgba(0, 212, 255, 0.2); border-radius: 6px;
            padding: 45px; text-align: center;
        }

        h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 5px; color: #ffffff; letter-spacing: 4px; }
        .tagline { color: #00D4FF; font-weight: 700; text-transform: uppercase; letter-spacing: 3px; font-size: 0.72rem; margin-bottom: 35px; opacity: 0.9; }
        
        .feature-list { text-align: left; margin: 25px 0; color: #94a3b8; font-size: 0.82rem; font-family: 'JetBrains Mono', monospace; }
        .feature-item { margin-bottom: 12px; display: flex; align-items: center; border-left: 2px solid #00D4FF; padding-left: 15px; }

        .loader-container { margin-top: 40px; }
        .progress-track { width: 100%; height: 2px; background: rgba(255,255,255,0.05); overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: #00D4FF; animation: fillProgress 10s forwards cubic-bezier(0.1, 0, 0.1, 1); }
        @keyframes fillProgress { from { width: 0%; } to { width: 98%; } }
        
        .loading-text { font-size: 0.65rem; color: #475569; letter-spacing: 2px; margin-top: 15px; text-transform: uppercase; font-weight: 700; }

        #root { opacity: 0; transition: opacity 1s ease; width: 100%; height: 100vh; }
        .ready #intro-screen { transform: translateY(-100%); opacity: 0; pointer-events: none; }
        .ready #root { opacity: 1; }
    </style>
    <link rel="stylesheet" href="cyber-theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.1/build/stlite.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="intro-screen">
        <div class="info-card">
            <h1>ARGUS</h1>
            <div class="tagline">AI-Powered Phishing Defense for Organisations</div>
            
            <div class="feature-list">
                <div class="feature-item">NLP INTENT PATTERN CLASSIFIER</div>
                <div class="feature-item">LOOKALIKE & HOMOGLYPH AUDITING</div>
                <div class="feature-item">PER-ACCOUNT SENDER BASELINES</div>
                <div class="feature-item">PERCEPTUAL HASH PAGE SIMILARITY</div>
                <div class="feature-item">LIVE SOC FEEDBACK & ACCURACY METRICS</div>
            </div>

            <div class="loader-container">
                <div class="progress-track"><div class="progress-bar"></div></div>
                <div class="loading-text">BOOTING ARGUS DEFENSE KERNEL...</div>
            </div>
        </div>
    </div>

    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.1/build/stlite.js"></script>
    <script>
        stlite.mount({
            requirements: ["pandas", "numpy", "plotly", "scikit-learn", "pillow"],
            entrypoint: "app.py",
            files: {
                "app.py": { url: "./app.py" },
                "cyber-theme.css": { url: "./cyber-theme.css" },
                "content_intelligence.py": { url: "./content_intelligence.py" },
                "domain_analyzer.py": { url: "./domain_analyzer.py" },
                "page_similarity.py": { url: "./page_similarity.py" },
                "sender_behavior.py": { url: "./sender_behavior.py" },
                "attachment_qr_inspection.py": { url: "./attachment_qr_inspection.py" },
                "verdict_engine.py": { url: "./verdict_engine.py" },
                "threat_origin_map.py": { url: "./threat_origin_map.py" },
                "simulator.py": { url: "./simulator.py" },
                "templates/reference_logins/microsoft365.png": { url: "./templates/reference_logins/microsoft365.png" },
                "templates/reference_logins/paypal.png": { url: "./templates/reference_logins/paypal.png" },
                "templates/reference_logins/internal_sso_portal.png": { url: "./templates/reference_logins/internal_sso_portal.png" },
            },
        }, document.getElementById("root"));

        const appCheck = setInterval(() => {
            if (document.querySelector('.stApp')) {
                clearInterval(appCheck);
                setTimeout(() => {
                    document.body.classList.add('ready');
                    window.dispatchEvent(new Event('resize'));
                }, 800);
            }
        }, 100);
    </script>
</body>
</html>
